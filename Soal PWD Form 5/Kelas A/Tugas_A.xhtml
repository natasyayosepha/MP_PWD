<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>
</head>

<body>

    <h1>Formulir Pendaftaran Seminar</h1>

    <form action="" method="post">

        <h2>Data Peserta</h2>

        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">

            <tr>
                <td style="width:32%;">
                    <strong>Nama Lengkap</strong>
                </td>
                <td>
                    <input type="text" name="nama_lengkap" size="20" />
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <strong>NIM</strong>
                </td>
                <td>
                    <input type="text" name="nim" size="20" />
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" name="jenis_kelamin"
                           value="Laki-laki" />
                    Laki-laki

                    <input type="radio" name="jenis_kelamin"
                           value="Perempuan" />
                    Perempuan
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <strong>Program Studi</strong>
                </td>
                <td>
                    <select name="program_studi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>

        </table>

        <h2>Pilihan Seminar</h2>

        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">

            <tr>
                <td style="width:32%;">
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <input type="radio" name="jenis_tiket"
                           value="Reguler" />
                    Reguler

                    <input type="radio" name="jenis_tiket"
                           value="VIP" />
                    VIP
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <strong>Topik Seminar</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" name="topik"
                               value="Web Development" />
                        Web Development
                    </p>

                    <p>
                        <input type="checkbox" name="topik"
                               value="Data Science" />
                        Data Science
                    </p>

                    <p>
                        <input type="checkbox" name="topik"
                               value="Artificial Intelligence" />
                        Artificial Intelligence
                    </p>
                </td>
            </tr>

        </table>

        <h2>Informasi Tambahan</h2>

        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">

            <tr>
                <td style="width:32%;">
                    <strong>Alasan Mengikuti Seminar</strong>
                </td>
                <td>
                    <textarea name="alasan" rows="5" cols="20"></textarea>
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <strong>Bukti Pembayaran</strong>
                </td>
                <td>
                    <input type="file" name="bukti_pembayaran" />
                </td>
            </tr>

            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" value="Simpan" />
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
